name: Research radar monitoring and discovery

on:
  schedule:
    - cron: "15 8 * * *"
      timezone: "Europe/Helsinki"
    - cron: "15 18 * * 0"
      timezone: "Europe/Helsinki"
  workflow_dispatch:
    inputs:
      mode:
        description: Workflow mode
        required: true
        default: monitor
        type: choice
        options: [monitor, weekly]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: radar-automation
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Monitor known official sources
        run: npm run monitor
      - name: Discover candidates with live web search
        if: github.event.schedule == '15 18 * * 0' || inputs.mode == 'weekly'
        run: npm run discover
      - name: Validate reviewed data remains unchanged
        run: npm run validate:data
      - name: Prepare weekly digest
        if: github.event.schedule == '15 18 * * 0' || inputs.mode == 'weekly'
        run: npm run digest
      - name: Ensure automation labels exist
        run: |
          gh label create data-review --color 0E8A86 --description "Official-source data awaiting human review" --force
          gh label create weekly-digest --color 1D76DB --description "Weekly research-radar digest" --force
      - name: Create or update one review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/research-radar-review
          delete-branch: true
          title: "Review: monitored source changes and discovery candidates"
          commit-message: "chore: stage radar monitoring results for review"
          body: |
            Automated review queue from official-source monitoring and live web-search discovery.

            - No candidate has been merged into `data/opportunities.json`.
            - Verify every material fact against the linked official page.
            - Never copy a historical deadline into a future cycle.
          labels: data-review
          add-paths: |
            data/source-state.json
            automation-output/monitor-report.json
            automation-output/discovered-candidates.json
      - name: Create or update exactly one ISO-week digest issue
        if: github.event.schedule == '15 18 * * 0' || inputs.mode == 'weekly'
        shell: bash
        run: |
          week="$(date -u +%G-W%V)"
          title="Research radar digest — ${week}"
          issue="$(gh issue list --state open --search "\"${title}\" in:title" --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file automation-output/weekly-digest.md
          else
            gh issue create --title "$title" --body-file automation-output/weekly-digest.md --label weekly-digest
          fi
